[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rockbot"
version = "0.1.0"
description = "A Rocket.Chat bot that answers user queries using a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rocketchat-async>=1.2.0",
    "ollama>=0.4.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
rockbot = "rockbot.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rockbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
